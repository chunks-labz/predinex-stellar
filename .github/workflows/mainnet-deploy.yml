name: Mainnet Deploy

# Triggers on tags matching v<major>.<minor>.<patch> (e.g. v1.0.0)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: mainnet-deploy
  cancel-in-progress: false   # never cancel an in-flight mainnet deploy

env:
  STELLAR_NETWORK: mainnet
  STELLAR_RPC_URL: https://mainnet.stellar.validationcloud.io/v1/${{ secrets.VALIDATION_CLOUD_KEY }}
  STELLAR_NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"

jobs:
  # ── 1. Safety checks ────────────────────────────────────────────────────────
  safety-checks:
    name: Pre-deployment Safety Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      wasm-hash: ${{ steps.build.outputs.wasm-hash }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          target: wasm32-unknown-unknown

      - name: Format check
        working-directory: contracts/predinex
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        working-directory: contracts/predinex
        run: cargo clippy -- -D warnings

      - name: Full test suite
        working-directory: contracts/predinex
        run: cargo test

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v22.8.1/stellar-cli-22.8.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin

      - name: Build & optimize WASM
        id: build
        working-directory: contracts/predinex
        run: |
          stellar contract build
          stellar contract optimize \
            --wasm target/wasm32-unknown-unknown/release/predinex.wasm
          HASH=$(sha256sum target/wasm32-unknown-unknown/release/predinex.optimized.wasm | awk '{print $1}')
          echo "wasm-hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Check deployer balance
        env:
          DEPLOYER_SECRET: ${{ secrets.MAINNET_DEPLOYER_SECRET }}
        run: |
          DEPLOYER_ADDRESS=$(stellar keys add deployer --secret-key "$DEPLOYER_SECRET" --quiet && stellar keys address deployer)
          BALANCE=$(stellar account show "$DEPLOYER_ADDRESS" --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            | grep "XLM balance" | awk '{print $3}' | tr -d ,)
          echo "Deployer balance: $BALANCE XLM"
          # Require at least 20 XLM for deploy fees
          python3 -c "
          b = float('${BALANCE}' or '0')
          if b < 20:
              raise SystemExit(f'Insufficient deployer balance: {b} XLM (need >= 20)')
          print(f'Balance OK: {b} XLM')
          "

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: predinex-wasm-${{ github.ref_name }}
          path: contracts/predinex/target/wasm32-unknown-unknown/release/predinex.optimized.wasm
          retention-days: 90

  # ── 2. Deploy ───────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Mainnet
    needs: safety-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: mainnet   # requires manual approval in GitHub Environments
    outputs:
      contract-id: ${{ steps.deploy.outputs.contract-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v22.8.1/stellar-cli-22.8.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: predinex-wasm-${{ github.ref_name }}
          path: wasm/

      - name: Import deployer key
        env:
          DEPLOYER_SECRET: ${{ secrets.MAINNET_DEPLOYER_SECRET }}
        run: stellar keys add deployer --secret-key "$DEPLOYER_SECRET" --quiet

      - name: Deploy contract
        id: deploy
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm wasm/predinex.optimized.wasm \
            --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            --source deployer \
            --fee 1000000)
          echo "contract-id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "Deployed contract: $CONTRACT_ID"

      - name: Initialize contract
        env:
          CONTRACT_ID: ${{ steps.deploy.outputs.contract-id }}
          XLM_SAC: ${{ secrets.MAINNET_XLM_SAC }}
          TREASURY_ADDRESS: ${{ secrets.MAINNET_TREASURY_ADDRESS }}
        run: |
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            --source deployer \
            --fee 100000 \
            -- initialize \
            --token "$XLM_SAC" \
            --treasury_recipient "$TREASURY_ADDRESS"

      - name: Save deployment artifact
        env:
          CONTRACT_ID: ${{ steps.deploy.outputs.contract-id }}
          WASM_HASH: ${{ needs.safety-checks.outputs.wasm-hash }}
        run: |
          mkdir -p deployments
          cat > deployments/${{ github.ref_name }}.json <<EOF
          {
            "version": "${{ github.ref_name }}",
            "contract_id": "$CONTRACT_ID",
            "wasm_hash": "$WASM_HASH",
            "git_sha": "${{ github.sha }}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "network": "mainnet",
            "deployed_by": "${{ github.actor }}"
          }
          EOF
          cat deployments/${{ github.ref_name }}.json

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.ref_name }}
          path: deployments/${{ github.ref_name }}.json
          retention-days: 365

      - name: Commit deployment record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          mkdir -p deployments
          cp deployments/${{ github.ref_name }}.json deployments/
          git add deployments/${{ github.ref_name }}.json
          git diff --cached --quiet || git commit -m "deploy: record mainnet deployment ${{ github.ref_name }} [skip ci]"
          git push origin main

  # ── 3. Smoke tests ──────────────────────────────────────────────────────────
  smoke-tests:
    name: Post-deployment Smoke Tests
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v22.8.1/stellar-cli-22.8.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin

      - name: Import deployer key
        env:
          DEPLOYER_SECRET: ${{ secrets.MAINNET_DEPLOYER_SECRET }}
        run: stellar keys add deployer --secret-key "$DEPLOYER_SECRET" --quiet

      - name: Smoke test — get_pool_count
        env:
          CONTRACT_ID: ${{ needs.deploy.outputs.contract-id }}
        run: |
          COUNT=$(stellar contract invoke \
            --id "$CONTRACT_ID" \
            --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            --source deployer \
            -- get_pool_count)
          echo "Pool count: $COUNT"
          [ "$COUNT" = "1" ] || [ "$COUNT" = '"1"' ] && echo "OK" || (echo "Unexpected pool count: $COUNT" && exit 1)

      - name: Smoke test — create_pool
        id: create-pool
        env:
          CONTRACT_ID: ${{ needs.deploy.outputs.contract-id }}
        run: |
          DEPLOYER_ADDRESS=$(stellar keys address deployer)
          POOL_ID=$(stellar contract invoke \
            --id "$CONTRACT_ID" \
            --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            --source deployer \
            --fee 100000 \
            -- create_pool \
            --creator "$DEPLOYER_ADDRESS" \
            --title '"Smoke test pool"' \
            --description '"Automated post-deploy check — do not bet"' \
            --outcome_a '"Yes"' \
            --outcome_b '"No"' \
            --duration 3600)
          echo "Created pool ID: $POOL_ID"
          echo "pool-id=$POOL_ID" >> "$GITHUB_OUTPUT"

      - name: Smoke test — get_pool
        env:
          CONTRACT_ID: ${{ needs.deploy.outputs.contract-id }}
          POOL_ID: ${{ steps.create-pool.outputs.pool-id }}
        run: |
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            --source deployer \
            -- get_pool \
            --pool_id "$POOL_ID" | grep -q "Smoke test pool"
          echo "get_pool OK"

  # ── 4. Notify ───────────────────────────────────────────────────────────────
  notify:
    name: Notify Deployment Status
    needs: [safety-checks, deploy, smoke-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.smoke-tests.result }}" = "success" ]; then
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
            echo "text=Mainnet deployment *${{ github.ref_name }}* succeeded." >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "emoji=⚠️" >> "$GITHUB_OUTPUT"
            echo "text=Mainnet deployment *${{ github.ref_name }}* deployed but smoke tests failed. Manual verification required." >> "$GITHUB_OUTPUT"
          else
            echo "emoji=🔴" >> "$GITHUB_OUTPUT"
            echo "text=Mainnet deployment *${{ github.ref_name }}* FAILED at ${{ needs.safety-checks.result == 'failure' && 'safety checks' || 'deploy' }} stage." >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"${{ steps.status.outputs.emoji }} ${{ steps.status.outputs.text }}\",
              \"attachments\": [{
                \"fields\": [
                  {\"title\": \"Version\", \"value\": \"${{ github.ref_name }}\", \"short\": true},
                  {\"title\": \"Contract\", \"value\": \"${{ needs.deploy.outputs.contract-id }}\", \"short\": true},
                  {\"title\": \"Actor\", \"value\": \"${{ github.actor }}\", \"short\": true},
                  {\"title\": \"Run\", \"value\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"short\": false}
                ]
              }]
            }"

      - name: Notify Discord
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"${{ steps.status.outputs.emoji }} ${{ steps.status.outputs.text }}\nVersion: \`${{ github.ref_name }}\`\nContract: \`${{ needs.deploy.outputs.contract-id }}\`\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"
