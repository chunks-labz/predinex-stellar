name: Deploy contract to mainnet

on:
  workflow_dispatch:
    inputs:
      git_tag:
        description: 'Git tag to deploy (e.g. v1.2.0)'
        required: true
        type: string
      confirm:
        description: 'Type DEPLOY to confirm mainnet deployment'
        required: true
        type: string
      run_lifecycle_smoke:
        description: 'Run the full place_bet -> settle -> claim smoke cycle (uses real XLM, a pre-funded bettor, and a ~5min wait)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Only deploy from the canonical upstream repo. Forks that pull this
# workflow do not have the secrets configured and would fail noisily.
env:
  CANONICAL_REPO: dimka90/predinex-stellar
  STELLAR_NETWORK: mainnet
  STELLAR_RPC_URL: https://mainnet.stellar.validationcloud.io/v1/${{ secrets.VALIDATION_CLOUD_KEY }}
  STELLAR_NETWORK_PASSPHRASE: 'Public Global Stellar Network ; September 2015'
  # Mainnet XLM Stellar Asset Contract
  XLM_TOKEN_MAINNET: CAS3J7GYLGXMF6TDJBBYYSE3HQ6BBSMLNUQ34T6TZMYMW2FC6NJT8BMI

concurrency:
  group: deploy-mainnet
  cancel-in-progress: false

jobs:
  guard:
    name: Validate inputs
    if: github.repository == 'dimka90/predinex-stellar' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check confirmation string
        env:
          INPUT_CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$INPUT_CONFIRM" != "DEPLOY" ]; then
            echo "::error::Confirmation string must be exactly DEPLOY"
            exit 1
          fi
          echo "Confirmation string is valid."

      - name: Check git tag format
        env:
          INPUT_GIT_TAG: ${{ github.event.inputs.git_tag }}
        run: |
          if [[ "$INPUT_GIT_TAG" != v* ]]; then
            echo "::error::git_tag must start with 'v' (got: $INPUT_GIT_TAG)"
            exit 1
          fi
          echo "Git tag format is valid: $INPUT_GIT_TAG"

  safety-checks:
    name: Pre-deployment Safety Checks
    needs: [guard]
    if: always() && !cancelled() && github.repository == 'dimka90/predinex-stellar'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      wasm-hash: ${{ steps.build.outputs.wasm-hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_tag || github.ref }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          target: wasm32-unknown-unknown

      - name: Format check
        working-directory: contracts/predinex
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        working-directory: contracts/predinex
        run: cargo clippy -- -D warnings

      - name: Full test suite
        working-directory: contracts/predinex
        run: cargo test

      - name: Cache stellar-cli
        id: stellar-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-v22-${{ runner.os }}

      - name: Install stellar-cli
        if: steps.stellar-cli-cache.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli@22.0.1

      - name: Build & optimize WASM
        id: build
        working-directory: contracts/predinex
        run: |
          stellar contract build
          stellar contract optimize \
            --wasm target/wasm32-unknown-unknown/release/predinex.wasm
          HASH=$(sha256sum target/wasm32-unknown-unknown/release/predinex.optimized.wasm | awk '{print $1}')
          echo "wasm-hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Verify WASM size
        # Soroban enforces a hard 64 KiB (65536 bytes) limit on deployed
        # contract WASM. Fail fast here so we never burn mainnet XLM
        # attempting to deploy an over-size binary. (#836)
        working-directory: contracts/predinex
        run: |
          set -euo pipefail
          MAX_WASM_BYTES=65536

          WASM_FILE=target/wasm32-unknown-unknown/release/predinex.optimized.wasm
          if [ ! -f "$WASM_FILE" ]; then
            echo "::error::no optimized wasm found after optimization step"
            exit 1
          fi

          WASM_SIZE=$(stat --format='%s' "$WASM_FILE" 2>/dev/null || stat -f'%z' "$WASM_FILE")
          echo "Optimized WASM size: $WASM_SIZE bytes (limit: $MAX_WASM_BYTES bytes / 64 KiB)"

          if [ "$WASM_SIZE" -gt "$MAX_WASM_BYTES" ]; then
            OVER=$(( WASM_SIZE - MAX_WASM_BYTES ))
            echo "::error::Optimized WASM ($WASM_SIZE bytes) exceeds the Soroban 64 KiB limit by $OVER bytes."
            exit 1
          fi

          PCT=$(awk "BEGIN { printf \"%.1f\", ($WASM_SIZE / $MAX_WASM_BYTES) * 100 }")
          echo "WASM size check passed — $WASM_SIZE / $MAX_WASM_BYTES bytes (${PCT}% of limit)"

      - name: Check deployer balance
        env:
          DEPLOYER_SECRET: ${{ secrets.MAINNET_DEPLOYER_SECRET }}
        run: |
          DEPLOYER_ADDRESS=$(stellar keys add deployer --secret-key "$DEPLOYER_SECRET" --quiet && stellar keys address deployer)
          BALANCE=$(stellar account show "$DEPLOYER_ADDRESS" --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            | grep "XLM balance" | awk '{print $3}' | tr -d ,)
          echo "Deployer balance: $BALANCE XLM"
          python3 -c "
          b = float('${BALANCE}' or '0')
          if b < 20:
              raise SystemExit(f'Insufficient deployer balance: {b} XLM (need >= 20)')
          print(f'Balance OK: {b} XLM')
          "

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: predinex-wasm-${{ github.ref_name }}
          path: contracts/predinex/target/wasm32-unknown-unknown/release/predinex.optimized.wasm
          retention-days: 90

  deploy:
    name: Deploy to Mainnet
    needs: safety-checks
    if: github.repository == 'dimka90/predinex-stellar'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: mainnet
    outputs:
      contract-id: ${{ steps.deploy.outputs.contract-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_tag || github.ref }}

      - name: Cache stellar-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-v22-${{ runner.os }}

      - name: Setup Rust (for stellar-cli reuse)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install stellar-cli if cache miss
        run: |
          if ! command -v stellar >/dev/null 2>&1; then
            cargo install --locked stellar-cli@22.0.1
          fi

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: predinex-wasm-${{ github.ref_name }}
          path: wasm/

      - name: Import deployer key
        env:
          DEPLOYER_SECRET: ${{ secrets.MAINNET_DEPLOYER_SECRET }}
        run: stellar keys add deployer --secret-key "$DEPLOYER_SECRET" --quiet

      - name: Deploy contract
        id: deploy
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm wasm/predinex.optimized.wasm \
            --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            --source deployer \
            --fee 1000000)
          echo "contract-id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "Deployed contract: $CONTRACT_ID"

      - name: Initialize contract
        env:
          CONTRACT_ID: ${{ steps.deploy.outputs.contract-id }}
          XLM_SAC: ${{ secrets.MAINNET_XLM_SAC }}
          TREASURY_ADDRESS: ${{ secrets.MAINNET_TREASURY_ADDRESS }}
        run: |
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            --source deployer \
            --fee 100000 \
            -- initialize \
            --token "$XLM_SAC" \
            --treasury_recipient "$TREASURY_ADDRESS"

      - name: Save deployment artifact
        env:
          CONTRACT_ID: ${{ steps.deploy.outputs.contract-id }}
          WASM_HASH: ${{ needs.safety-checks.outputs.wasm-hash }}
        run: |
          mkdir -p deployments
          cat > deployments/${{ github.ref_name }}.json <<EOF
          {
            "version": "${{ github.ref_name }}",
            "contract_id": "$CONTRACT_ID",
            "wasm_hash": "$WASM_HASH",
            "git_sha": "${{ github.sha }}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "network": "mainnet",
            "deployed_by": "${{ github.actor }}"
          }
          EOF
          cat deployments/${{ github.ref_name }}.json

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.ref_name }}
          path: deployments/${{ github.ref_name }}.json
          retention-days: 365

      - name: Commit deployment record
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          mkdir -p deployments
          cp deployments/${{ github.ref_name }}.json deployments/
          git add deployments/${{ github.ref_name }}.json
          git diff --cached --quiet || git commit -m "deploy: record mainnet deployment ${{ github.ref_name }} [skip ci]"
          git push origin main

  smoke:
    name: Smoke test
    needs: deploy
    if: github.repository == 'dimka90/predinex-stellar'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.run.outputs.passed }}
      create_tx: ${{ steps.run.outputs.create_tx }}
      pool_count_before: ${{ steps.run.outputs.before }}
      pool_count_after: ${{ steps.run.outputs.after }}
      pool_id: ${{ steps.run.outputs.pool_id }}
      bet_placed: ${{ steps.run.outputs.bet }}
      settled: ${{ steps.run.outputs.settle }}
      claim_amount: ${{ steps.run.outputs.claim }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache stellar-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-v22-${{ runner.os }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install stellar-cli if cache miss
        run: |
          if ! command -v stellar >/dev/null 2>&1; then
            cargo install --locked stellar-cli@22.0.1
          fi

      - name: Import deployer key
        env:
          DEPLOYER_SECRET: ${{ secrets.MAINNET_DEPLOYER_SECRET }}
        run: stellar keys add deployer --secret-key "$DEPLOYER_SECRET" --quiet

      - name: Register bettor key (optional lifecycle smoke)
        if: github.event.inputs.run_lifecycle_smoke == 'true'
        env:
          STELLAR_MAINNET_BETTOR_SECRET_KEY: ${{ secrets.STELLAR_MAINNET_BETTOR_SECRET_KEY }}
        run: |
          if [ -z "$STELLAR_MAINNET_BETTOR_SECRET_KEY" ]; then
            echo "::error::run_lifecycle_smoke=true but STELLAR_MAINNET_BETTOR_SECRET_KEY is not configured."
            exit 1
          fi
          stellar keys add bettor \
            --secret-key "$STELLAR_MAINNET_BETTOR_SECRET_KEY" \
            --network mainnet
          echo "Bettor address: $(stellar keys address bettor)"

      - name: Run smoke checks
        id: run
        env:
          CONTRACT_ID: ${{ needs.deploy.outputs.contract-id }}
          INPUT_GIT_TAG: ${{ github.event.inputs.git_tag || github.ref_name }}
          SMOKE_COMMIT: ${{ github.sha }}
          RUN_LIFECYCLE: ${{ github.event.inputs.run_lifecycle_smoke || 'false' }}
        run: |
          set -euo pipefail

          BEFORE=$(stellar contract invoke \
            --id "$CONTRACT_ID" \
            --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            --source deployer \
            -- get_pool_count)
          echo "Pool count before: $BEFORE"
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"

          SMOKE_TS=$(date -u +%Y%m%d-%H%M%S)

          TX_HASH=$(stellar contract invoke \
            --id "$CONTRACT_ID" \
            --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            --source deployer \
            --send=yes \
            --output hash \
            -- create_pool \
            --creator "$(stellar keys address deployer)" \
            --title "Mainnet smoke: $SMOKE_TS" \
            --description "Automated mainnet smoke test from tag $INPUT_GIT_TAG commit $SMOKE_COMMIT" \
            --outcome_a "Yes" \
            --outcome_b "No" \
            --duration 300 \
            --amount 10000000)
          echo "Create pool tx hash: $TX_HASH"
          echo "create_tx=$TX_HASH" >> "$GITHUB_OUTPUT"

          AFTER=$(stellar contract invoke \
            --id "$CONTRACT_ID" \
            --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            --source deployer \
            -- get_pool_count)
          echo "Pool count after: $AFTER"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"

          if [ "$AFTER" = "$BEFORE" ]; then
            echo "::error::create_pool did not increment pool count (before=$BEFORE, after=$AFTER)"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Extract the newly created pool ID (last pool in the list)
          POOL_ID=$(stellar contract invoke \
            --id "$CONTRACT_ID" \
            --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            --source deployer \
            -- get_pool_count)
          POOL_ID=$((POOL_ID))
          echo "pool_id=$POOL_ID" >> "$GITHUB_OUTPUT"

          if [ "$RUN_LIFECYCLE" != "true" ]; then
            echo "Lifecycle smoke (place_bet -> settle -> claim) skipped."
            echo "bet=skipped" >> "$GITHUB_OUTPUT"
            echo "settle=skipped" >> "$GITHUB_OUTPUT"
            echo "claim=skipped" >> "$GITHUB_OUTPUT"
            echo "passed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BETTOR=$(stellar keys address bettor)
          echo "Bettor address: $BETTOR"

          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            --source bettor \
            -- place_bet \
            --user "$BETTOR" \
            --pool_id "$POOL_ID" \
            --outcome 0 \
            --amount 2000000
          echo "Placed bet of 2000000 stroops on outcome 0"
          echo "bet=true" >> "$GITHUB_OUTPUT"

          echo "Waiting 330s for pool $POOL_ID to expire before settling..."
          sleep 330

          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            --source deployer \
            -- settle_pool \
            --caller "$(stellar keys address deployer)" \
            --pool_id "$POOL_ID" \
            --winning_outcome 0
          echo "Settled pool $POOL_ID with winning outcome 0"
          echo "settle=true" >> "$GITHUB_OUTPUT"

          CLAIM=$(stellar contract invoke \
            --id "$CONTRACT_ID" \
            --network mainnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            --source bettor \
            -- claim_winnings \
            --user "$BETTOR" \
            --pool_id "$POOL_ID")
          CLAIM=$(echo "$CLAIM" | tr -d '"')
          echo "Claimed winnings: $CLAIM stroops"
          echo "claim=$CLAIM" >> "$GITHUB_OUTPUT"
          if [ -z "$CLAIM" ] || [ "$CLAIM" -le 0 ]; then
            echo "::error::claim_winnings returned a non-positive payout ($CLAIM)"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "passed=true" >> "$GITHUB_OUTPUT"

  report:
    name: Report
    needs: [deploy, smoke]
    if: always() && github.repository == 'dimka90/predinex-stellar'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.smoke.result }}" = "success" ]; then
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
            echo "text=Success" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "emoji=⚠️" >> "$GITHUB_OUTPUT"
            echo "text=Deployed, smoke failed" >> "$GITHUB_OUTPUT"
          else
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            echo "text=Failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS_TEXT: ${{ steps.status.outputs.text }}
          STATUS_EMOJI: ${{ steps.status.outputs.emoji }}
          CONTRACT_ID: ${{ needs.deploy.outputs.contract-id }}
          GIT_TAG: ${{ github.event.inputs.git_tag || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"$STATUS_EMOJI Mainnet deploy: $STATUS_TEXT — tag \`$GIT_TAG\` contract \`$CONTRACT_ID\` (<$RUN_URL|run>)\"
            }"

      - name: Notify Discord
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS_TEXT: ${{ steps.status.outputs.text }}
          STATUS_EMOJI: ${{ steps.status.outputs.emoji }}
          CONTRACT_ID: ${{ needs.deploy.outputs.contract-id }}
          GIT_TAG: ${{ github.event.inputs.git_tag || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"$STATUS_EMOJI Mainnet deploy: $STATUS_TEXT — tag \`$GIT_TAG\` contract \`$CONTRACT_ID\` ($RUN_URL)\"
            }"
